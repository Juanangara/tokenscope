<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tokenscope demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f9f9f7;
      --surface: #fcfcfb;
      --ink: #0b0b0b;
      --ink-2: #52514e;
      --muted: #898781;
      --line: #e1e0d9;
      --accent: #2a78d6;
      --accent-ink: #ffffff;
      --user-bg: #e8f0fb;
      --good: #0b7a0b;
      --bad: #b02a2a;
      --warn: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0d0d0d;
        --surface: #1a1a19;
        --ink: #f0efec;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --line: #2c2c2a;
        --accent: #3987e5;
        --accent-ink: #0b0b0b;
        --user-bg: #1d2b3f;
        --good: #0ca30c;
        --bad: #e66767;
        --warn: #fab219;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .app {
      max-width: 760px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 1.1rem; font-weight: 650; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; align-items: center; }
    .pill {
      font-size: 0.8rem;
      color: var(--ink-2);
      padding: 2px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      white-space: nowrap;
    }
    .pill::before {
      content: "";
      display: inline-block;
      width: 8px; height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .pill.ok::before { background: var(--good); }
    .pill.down::before { background: var(--bad); }
    .pill.plain::before { display: none; }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    details.settings { margin-top: 8px; font-size: 0.9rem; color: var(--ink-2); }
    details.settings summary { cursor: pointer; width: fit-content; }
    .settings-grid { display: grid; gap: 10px; padding: 10px 0 4px; max-width: 420px; }
    label { display: grid; gap: 4px; }
    input[type="password"], input[type="number"], textarea {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 8px 10px;
      width: 100%;
    }
    .hint { color: var(--muted); font-size: 0.8rem; }

    #log { flex: 1; padding: 16px 0; display: flex; flex-direction: column; gap: 14px; }
    .empty { color: var(--muted); text-align: center; margin: 12vh 0; }
    .msg { max-width: 92%; }
    .msg.user { align-self: flex-end; }
    .msg .body {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      min-height: 2.6em;
    }
    .msg.user .body { background: var(--user-bg); border-color: transparent; }
    .msg .body.waiting::after {
      content: "…";
      color: var(--muted);
      animation: blink 1s steps(2, start) infinite;
    }
    .msg .body.notice { color: var(--warn); }
    .msg .body.error { color: var(--bad); }
    .msg .stats { margin: 4px 4px 0; font-size: 0.78rem; color: var(--muted); }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .msg .body.waiting::after { animation: none; } }

    form {
      position: sticky;
      bottom: 0;
      padding: 12px 0 16px;
      background: linear-gradient(to bottom, transparent, var(--bg) 24%);
      display: grid;
      gap: 8px;
    }
    .composer-row { display: flex; gap: 8px; align-items: flex-end; }
    textarea { resize: none; min-height: 44px; max-height: 160px; }
    footer { padding: 0 0 16px; font-size: 0.8rem; color: var(--muted); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>tokenscope</h1>
      <div class="pills">
        <span id="engine" class="pill">checking…</span>
        <span id="load" class="pill plain" hidden></span>
        <button id="new-chat" type="button">New chat</button>
      </div>
      <details class="settings">
        <summary>Settings</summary>
        <div class="settings-grid">
          <label>API key (only needed if the service has keys set)
            <input id="api-key" type="password" autocomplete="off" placeholder="not stored anywhere">
          </label>
          <label>Maximum answer length (tokens)
            <input id="max-tokens" type="number" min="1" max="1024" value="200">
          </label>
        </div>
      </details>
    </header>

    <main id="log" aria-live="polite" aria-label="Conversation">
      <p class="empty" id="empty">Ask something. Each answer shows how long it took to start and how fast it was written.</p>
    </main>

    <form id="composer">
      <div class="composer-row">
        <textarea id="prompt" rows="1" placeholder="Write a message" aria-label="Message" required></textarea>
        <button id="send" class="primary" type="submit">Send</button>
        <button id="stop" type="button" hidden>Stop</button>
      </div>
    </form>

    <footer>
      Open this page in two or three tabs and send at the same time to watch the queue fill up.
      <a href="/docs">API docs</a>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
