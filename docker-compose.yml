services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --model /models/${MODEL_FILE}
      --host 0.0.0.0
      --port 8080
      --ctx-size ${CTX_SIZE}
      --parallel ${PARALLEL_SLOTS}
      --threads ${THREADS}
      --metrics
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:${LLAMA_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  gateway:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Compose the engine is reached by service name, and the gateway lets exactly as
      # many requests run as the engine has slots (one variable, no way to get them out of sync).
      LLAMA_BASE_URL: http://llama:8080
      MAX_CONCURRENT_REQUESTS: ${PARALLEL_SLOTS}
      # The drift reference survives restarts. To learn a new one, delete this file
      # (docker compose exec gateway rm /data/drift-reference.json) and restart the gateway.
      DRIFT_REFERENCE_FILE: /data/drift-reference.json
    volumes:
      - gateway-data:/data
    depends_on:
      llama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      gateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Local demo convenience: anyone who can reach the (localhost-only) port can look
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  gateway-data:
  prometheus-data:
  grafana-data:
