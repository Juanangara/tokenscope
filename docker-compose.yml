services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --model /models/${MODEL_FILE}
      --host 0.0.0.0
      --port 8080
      --ctx-size ${CTX_SIZE}
      --parallel ${PARALLEL_SLOTS}
      --threads ${THREADS}
      --metrics
    volumes:
      - ./models:/models:ro
    ports:
      - "${LLAMA_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
