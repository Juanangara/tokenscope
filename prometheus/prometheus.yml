global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  # The engine's own metrics (enabled with --metrics in docker-compose.yml)
  - job_name: engine
    metrics_path: /metrics
    static_configs:
      - targets: ["llama:8080"]
